<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>TANK SURVIVAL | Tactical Arcade Combat</title>
    <meta name="description" content="High-octane tank survival game. Battle waves of predictive AI enemies in this polished browser-based tactical shooter.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="top-bar">
            <div class="title">TANK DUEL</div>
        </div>

        <div class="game-container">
            <svg class="settings-cog" id="settingsBtn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>

            <div class="scoreboard">
                <div class="p1-score">SCORE: <span id="p1Score">0</span></div>
                <div class="p2-score">WAVE: <span id="p2Score">1</span></div>
                <div class="high-score">HIGH: <span id="highScore">0</span></div>
            </div>

            <canvas id="gameCanvas" width="1100" height="600"></canvas>
            
            <div id="menu" class="overlay">
                <div class="content">
                    <h1>TANK SURVIVAL</h1>
                    <p class="subtitle">Tactical Combat Prototype</p>
                    <button id="startBtn">ENGAGE</button>
                    <div class="instructions">
                        <div class="p-info">
                            <h3>CONTROLS</h3>
                            <p>WASD or ARROWS / SPACE or ENTER</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="gameOver" class="overlay hidden">
                <div class="content">
                    <h2 id="winnerText">DOMINATION COMPLETE</h2>
                    <button id="restartBtn">REINITIALIZE</button>
                </div>
            </div>

        <div class="status-bar">
            <p id="statusText">System: Ready</p>
            <p class="credit">MADE BY SURAJ</p>
        </div>
    </div>

    <!-- Mobile Controls (Moved outside wrapper for easier fixed positioning) -->
    <div id="mobileControls">
        <div id="joystickZone">
            <div id="joystickBase">
                <div id="joystickStick"></div>
            </div>
        </div>
        <button id="mobileFireBtn">FIRE</button>
    </div>

    <!-- Settings Overlay -->
    <div id="settingsOverlay" class="settings-overlay" style="display: none;">
        <div class="settings-content">
            <h2 style="color: var(--primary); margin-top: 0; font-size: 1.5rem; letter-spacing: 2px;">SETTINGS</h2>
            <div class="setting-row">
                <span style="color: #fff; font-size: 0.9rem;">FIXED JOYSTICK</span>
                <label class="switch">
                    <input type="checkbox" id="fixedJoystickToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <button id="closeSettings" class="btn" style="width: 100%; margin-top: 10px;">CLOSE</button>
        </div>
    </div>

    <!-- Modular Scripts (Loaded in order for file:// compatibility) -->
    <script src="js/utils.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/input.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/powerups.js"></script>
    <script src="js/tanks.js"></script>
    <script src="js/bullets.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/waveManager.js"></script>
    <script src="js/rendering.js"></script>
    <script src="js/ui.js"></script>
    <script src="game.js"></script>
</body>
</html>
